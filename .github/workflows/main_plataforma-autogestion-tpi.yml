name: Build and deploy ASP.Net Core app to Azure Web App - plataforma-autogestion-tpi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build Plataforma-Autogestion.slnx --configuration Release

      - name: dotnet publish
        run: dotnet publish PlataformaAutogestion.Api/PlataformaAutogestion.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8EC077685F174A6DA474BD95E3D89BC1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A21065982C194DC896352B5C7BAE927D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4191EAE885814734A8868E1DDB86E106 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'plataforma-autogestion-tpi'
          slot-name: 'Production'
          package: .